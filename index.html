<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>フェスタ後アンケート Google口コミ動線</title>
<style>
:root{
  --bg:#faf9f7; --ink:#2b2926; --ink-2:#6b645c; --ink-3:#9a938a;
  --accent:#8c7355; --accent-soft:#f0eae1;
  --green:#06c755; --talk:#7494c0;
  color-scheme: light;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  line-height:1.75; -webkit-font-smoothing:antialiased; font-size:15px;
  display:flex; flex-direction:column; align-items:center;
  padding:44px 20px 56px; min-height:100vh;
}
.head{text-align:center;margin-bottom:26px;max-width:560px}
.head .eyebrow{font-size:11px;letter-spacing:.22em;color:var(--accent);margin-bottom:12px}
.head h1{font-size:21px;font-weight:600;letter-spacing:.02em;line-height:1.6;text-wrap:balance}
.head p{margin-top:12px;color:var(--ink-2);font-size:13.5px}

.reset-btn{
  padding:9px 22px;border:1.5px solid var(--accent);border-radius:24px;
  background:#fff;color:var(--accent);font-size:13px;font-weight:600;
  cursor:pointer;transition:all .18s;font-family:inherit;margin-bottom:22px;
}
.reset-btn:hover{background:var(--accent-soft)}
.reset-btn:focus-visible,.qr-btn:focus-visible,.cta-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- phone ---------- */
.phone{width:375px;max-width:100%;background:#fff;border-radius:38px;overflow:hidden;box-shadow:0 20px 60px rgba(43,41,38,.16),0 0 0 1px rgba(0,0,0,.05)}
.status-bar{height:46px;background:var(--green);display:flex;align-items:flex-end;justify-content:center;padding-bottom:7px}
.status-bar span{color:#fff;font-size:11px;font-weight:600}
.line-header{background:var(--green);padding:10px 16px 14px;display:flex;align-items:center;gap:12px}
.line-header .back{color:#fff;font-size:22px;line-height:1}
.avatar-header{width:36px;height:36px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:8.5px;font-weight:700;color:var(--accent);flex-shrink:0;line-height:1.15;text-align:center}
.line-header .name{color:#fff;font-size:15px;font-weight:600}
.chat{background:var(--talk);height:580px;overflow-y:auto;padding:16px 12px;scroll-behavior:smooth}

.date-label{text-align:center;margin-bottom:16px}
.date-label span{background:rgba(0,0,0,.25);color:#fff;font-size:11px;padding:3px 12px;border-radius:12px}

.msg-row{display:flex;align-items:flex-end;gap:8px;margin-bottom:8px;animation:fadeIn .35s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.msg-row.bot{justify-content:flex-start}
.msg-row.user{justify-content:flex-end}
.avatar{width:36px;height:36px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;color:var(--accent);flex-shrink:0;align-self:flex-start;line-height:1.15;text-align:center}
.bubble{max-width:252px;padding:10px 14px;border-radius:18px;font-size:13.5px;line-height:1.75;white-space:pre-wrap;word-break:break-word}
.bot .bubble{background:#fff;color:#111;border-bottom-left-radius:4px}
.user .bubble{background:var(--green);color:#fff;border-bottom-right-radius:4px}
.bot .bubble.copy{background:#fbf8f3;border:1.5px dashed var(--accent);color:#4a3d2c}
.time{font-size:10px;color:rgba(255,255,255,.75);flex-shrink:0;align-self:flex-end;margin-bottom:2px}
.msg-row.user .time{order:-1}
.hint{margin:-2px 0 10px 44px;font-size:10.5px;color:#fff;opacity:.9;animation:fadeIn .35s ease}

.quick-replies{display:flex;flex-direction:column;gap:8px;margin:8px 0 10px 44px;animation:fadeIn .35s ease}
.qr-btn{background:#fff;border:1.5px solid var(--green);border-radius:20px;padding:10px 18px;font-size:13.5px;color:var(--green);font-weight:600;cursor:pointer;transition:all .15s;max-width:252px;text-align:center;font-family:inherit}
.qr-btn:hover{background:var(--green);color:#fff}
.qr-btn:active{transform:scale(.96)}
.qr-btn.disabled{pointer-events:none;opacity:.4}

.cta-wrap{margin:8px 0 10px 44px;animation:fadeIn .35s ease}
.cta-btn{display:block;background:var(--green);color:#fff;border:none;border-radius:20px;padding:12px 22px;font-size:13.5px;font-weight:600;text-align:center;text-decoration:none;max-width:252px;cursor:pointer;font-family:inherit}
.cta-btn:hover{background:#05b34c}

.typing{display:flex;align-items:flex-end;gap:8px;margin-bottom:8px}
.typing-dots{background:#fff;border-radius:18px;border-bottom-left-radius:4px;padding:12px 18px;display:flex;gap:4px}
.typing-dots span{width:8px;height:8px;background:#aaa;border-radius:50%;animation:bounce .6s infinite alternate}
.typing-dots span:nth-child(2){animation-delay:.15s}
.typing-dots span:nth-child(3){animation-delay:.3s}
@keyframes bounce{to{transform:translateY(-4px);opacity:.5}}

.bottom-bar{background:#f7f7f7;border-top:1px solid #ddd;padding:10px 16px;display:flex;align-items:center;gap:10px}
.input-fake{flex:1;background:#fff;border:1px solid #ddd;border-radius:20px;padding:8px 16px;font-size:13px;color:#999}

footer{margin-top:26px;font-size:11.5px;color:var(--ink-3);text-align:center}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .chat{scroll-behavior:auto}
}
</style>
</head>
<body>

<div class="head">
  <div class="eyebrow">浜松ウェディングフェスタ</div>
  <h1>フェスタ後アンケート → Google口コミ 動線</h1>
  <p>緑のボタンをタップすると、次のメッセージが届きます。「口コミを投稿する」と「今回は見送る」の両方をお試しください。</p>
</div>

<button class="reset-btn" onclick="resetChat()">最初から再生する</button>

<div class="phone">
  <div class="status-bar"><span>18:42</span></div>
  <div class="line-header">
    <span class="back">&lsaquo;</span>
    <div class="avatar-header">浜松<br>フェスタ</div>
    <span class="name">浜松ウェディングフェスタ</span>
  </div>
  <div class="chat" id="chat"></div>
  <div class="bottom-bar"><div class="input-fake">Aa</div></div>
</div>

<footer>株式会社スティルアン 御中／Leit On 大石</footer>

<script>
const REVIEW_URL = 'https://g.page/r/CZq9Vv1ky7-UEAE/review';

const TICKET_BODY = '【キャトルセゾン浜松】のレストランでご利用いただけるお食事チケットです！\nぜひおふたりの特別なひとときとしてご利用ください🍴\n\n気になる結婚式場のご見学予約や結婚式に関するご相談も、このLINEからお気軽にお問い合わせください💍\n\nおふたりらしい結婚式との出会いを、スタッフ一同応援しております。\n今後とも浜松ウェディングフェスタをよろしくお願いいたします😊';

const M1 = '{name}様\n\nアンケートへのご回答ありがとうございました✨\n当日のご感想、ありがたく読ませていただきますね。';

const M2 = 'それと、もうひとつだけお願いさせてください🙏\n\nいま書いていただいたご感想、そのままGoogleの口コミにも載せていただけませんか？\n\n式場探しをされている方が一番参考にされるのは、実際に足を運ばれた方の言葉なんです。\nコピーして貼り付けるだけなので、1分ほどで終わります😊';

const M3A = 'ありがとうございます、とても助かります✨\n\n次のメッセージに、書いていただいたご感想をそのまま載せておきますね。\n\n1. 次のメッセージを長押しして「コピー」を選ぶ\n2. 下のボタンから投稿ページを開く\n3. 星の数を選んで、貼り付けたら投稿\n\n※Googleアカウントへのログインが必要です\n※文章はそのままでも、書き換えていただいても大丈夫です';

const M3B = 'スタッフの方が丁寧に案内してくださって、初めての式場見学でも不安なく回れました。チャペルの雰囲気が想像以上で、ここで挙げたいと素直に思えました。\n\n（アンケートのご感想がそのまま入ります）';

const M3C = '下のボタンから投稿ページを開いて、貼り付けてください👇';

const T_YES = 'あわせて、参加特典のレストランチケットをお送りいたします🎁\n\n' + TICKET_BODY;

const T_NO = '承知しました！\nご回答いただいた皆さまへ、参加特典のレストランチケットをお送りいたします🎁\n\n' + TICKET_BODY;

const TERMS = 'レストランのご予約については、こちらの*浜松ウェディングフェスタ*のLINEのみで承っております。\nご希望の日時、アレルギー食材をメッセージにてお送りくださいませ✉️\n※レストランサイト等からはご予約いただけませんのでご注意ください\n〈ランチ〉11:30〜L.O.13:30\n〈ディナー〉17:30〜L.O.20:00\nレストラン定休日：火曜日\n\n※ご利用条件・有効期限をご確認のうえご利用ください。\n\n【ご利用規約】\n・ご利用の際はこちらのメッセージ画面をご提示ください\n・本件1枚につきフルコース2名様分（1万円相当）をご用意いたします\n・ドリンクのご注文をいただいた場合、代金は別途頂戴いたします\n・キャトルセゾン浜松のみご利用が可能です\n・チケットのご利用はフェスタ参加日より3か月間となります\n・ご予約日は平日限定です\n・イベント期間中（GW・クリスマス・年末年始等）はお受けできません\n・イベント期間中以外でもご予約状況によってはお受けできない場合もございます\n・必ずご利用日の前日までにご予約をお願いいたします\n・他チケットや特典との併用は不可となります\n・第三者への譲渡は禁止とさせていただきます\n\nこちらのチケットに関するお問い合わせは*浜松ウェディングフェスタ*までお願いいたします';

let runId = 0;

const chat = () => document.getElementById('chat');
const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
const scroll = () => { const c = chat(); c.scrollTop = c.scrollHeight; };

function dateLabel(text){
  const d = document.createElement('div');
  d.className = 'date-label';
  d.innerHTML = '<span>' + esc(text) + '</span>';
  chat().appendChild(d);
}

function addBot(text, time, copy){
  const row = document.createElement('div');
  row.className = 'msg-row bot';
  row.innerHTML = '<div class="avatar">浜松<br>フェスタ</div>'
    + '<div class="bubble' + (copy ? ' copy' : '') + '">' + esc(text) + '</div>'
    + '<span class="time">' + time + '</span>';
  chat().appendChild(row);
  scroll();
}

function addUser(text, time){
  const row = document.createElement('div');
  row.className = 'msg-row user';
  row.innerHTML = '<span class="time">' + time + '</span><div class="bubble">' + esc(text) + '</div>';
  chat().appendChild(row);
  scroll();
}

function addHint(text){
  const h = document.createElement('div');
  h.className = 'hint';
  h.textContent = text;
  chat().appendChild(h);
  scroll();
}

function addCta(label, url){
  const wrap = document.createElement('div');
  wrap.className = 'cta-wrap';
  const a = document.createElement('a');
  a.className = 'cta-btn';
  a.href = url;
  a.target = '_blank';
  a.rel = 'noopener';
  a.textContent = label + ' ▶';
  wrap.appendChild(a);
  chat().appendChild(wrap);
  scroll();
}

function addQuick(options){
  const qr = document.createElement('div');
  qr.className = 'quick-replies';
  options.forEach(o => {
    const b = document.createElement('button');
    b.className = 'qr-btn';
    b.type = 'button';
    b.textContent = o.label;
    b.onclick = () => {
      qr.querySelectorAll('.qr-btn').forEach(x => x.classList.add('disabled'));
      o.action();
    };
    qr.appendChild(b);
  });
  chat().appendChild(qr);
  scroll();
}

async function typing(my){
  const t = document.createElement('div');
  t.className = 'typing';
  t.innerHTML = '<div class="avatar">浜松<br>フェスタ</div><div class="typing-dots"><span></span><span></span><span></span></div>';
  chat().appendChild(t);
  scroll();
  await sleep(900);
  t.remove();
  return my === runId;
}

async function startMain(){
  const my = ++runId;
  chat().innerHTML = '';
  dateLabel('アンケート回答の直後');
  await sleep(400); if (my !== runId) return;

  addBot(M1, '18:42');
  await sleep(1000); if (my !== runId) return;

  addBot(M2, '18:42');
  await sleep(350); if (my !== runId) return;

  addQuick([
    { label: '口コミを投稿する', action: () => choosePost(my) },
    { label: '今回は見送る',     action: () => chooseSkip(my) }
  ]);
}

async function choosePost(my){
  if (my !== runId) return;
  addUser('口コミを投稿する', '18:43');
  await sleep(500); if (my !== runId) return;
  if (!await typing(my)) return;

  addBot(M3A, '18:43');
  await sleep(900); if (my !== runId) return;

  addBot(M3B, '18:43', true);
  addHint('▲ 前後に文字を入れず単独で送ります（長押しでコピーできるように）');
  await sleep(900); if (my !== runId) return;

  addBot(M3C, '18:43');
  await sleep(300); if (my !== runId) return;
  addCta('投稿ページを開く', REVIEW_URL);
  await sleep(1100); if (my !== runId) return;

  addBot(T_YES, '18:43');
  addHint('▲ 投稿を待たずに届きます。投稿の確認を条件にしないため。');
  await sleep(1100); if (my !== runId) return;
  addBot(TERMS, '18:43');
  addHint('▲ この画面がチケットの提示用になります');
}

async function chooseSkip(my){
  if (my !== runId) return;
  addUser('今回は見送る', '18:43');
  await sleep(500); if (my !== runId) return;
  if (!await typing(my)) return;
  addBot(T_NO, '18:43');
  await sleep(300); if (my !== runId) return;
  addHint('▲ 見送っても同じチケットが届きます。理由も聞かず、再依頼もしません。');
  await sleep(900); if (my !== runId) return;
  addBot(TERMS, '18:43');
  addHint('▲ この画面がチケットの提示用になります');
}

function resetChat(){
  startMain();
}

startMain();

</script>

</body>
</html>
